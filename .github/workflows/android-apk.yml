name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and bundled offline model
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "Qwen3-1.7B_dynamic_wi4b32_afp32.litertlm"
          APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK size: $APK_SIZE bytes"
          test "$APK_SIZE" -gt 850000000

      - name: Split APK for reliable transfer
        run: |
          split --bytes=250M --numeric-suffixes=0 --suffix-length=2 app/build/outputs/apk/debug/app-debug.apk jarvis-apk.part
          ls -lh jarvis-apk.part*

      - name: Upload APK part 00
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-part-00
          path: jarvis-apk.part00
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK part 01
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-part-01
          path: jarvis-apk.part01
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK part 02
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-part-02
          path: jarvis-apk.part02
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK part 03
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-part-03
          path: jarvis-apk.part03
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
